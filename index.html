<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор рецептів на вечерю</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Генератор рецептів на вечерю</h1>
    </header>

    <main>
        <section id="generate_recipe">
            <h2>Згенерувати рецепт</h2>
        </section>

        <section id="recipes_history">
            <h2>Історія згенерованих рецептів</h2>

            <div class="cards">
                <article>
                    <img src="assets/img/dish1.png" alt="Печена редиска на соусі з Фети фото">
                    <h3>Печена редиска на соусі з Фети</h3>
                </article>

                <article>
                    <img src="assets/img/dish2.jpg" alt="Кімчі з баклажанів по-корейськи фото">
                    <h3>Кімчі з баклажанів по-корейськи</h3>
                </article>

                <article>
                    <img src="assets/img/dish3.jpg" alt="Фарширований сиром перець фото">
                    <h3>Фарширований сиром перець</h3>
                </article>
            </div>
        </section>
    </main>


    <footer>
        <p>Ольга, ІП-53, 2026</p>
    </footer>  

    <script src="js/app.js"></script>
</body>
</html>
